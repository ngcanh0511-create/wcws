<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chi tiết trận đấu — WCPL</title>
  <link rel="icon" href="/assets/favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/main.css" rel="stylesheet">
  <link href="/css/sportsbook.css" rel="stylesheet">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <div class="container-xl py-4">

    <!-- Match header -->
    <div id="match-header">
      <div class="text-center py-5 text-muted">
        <div class="spinner-border me-2"></div>Đang tải...
      </div>
    </div>

    <div class="row g-4 mt-1" id="main-content" style="display:none !important">

      <!-- ── Cột trái: Betting lines ───────────────────────────── -->
      <div class="col-lg-7">
        <div class="betting-panel" id="betting-panel">
          <div class="betting-panel-header"><i class="bi bi-list-check me-2"></i>Danh sách kèo</div>
          <div id="betting-lines">
            <div class="text-center py-4 text-muted small">Chưa có kèo cho trận này.</div>
          </div>
        </div>
      </div>

      <!-- ── Cột phải: Bet slip + Lịch sử ─────────────────────── -->
      <div class="col-lg-5">

        <!-- Bet Slip -->
        <div id="bet-slip-section" class="bet-slip mb-4" style="display:none">
          <div class="bet-slip-title">🎰 Đặt cược</div>
          <div class="small text-muted mb-2" id="selected-line-desc">—</div>
          <div class="d-flex align-items-center gap-2 mb-2">
            <span class="text-warning fw-bold" id="selected-line-odds">—</span>
            <span class="small text-muted">× số xu đặt</span>
          </div>

          <div class="mb-2">
            <label class="form-label small">Số xu đặt cược</label>
            <input type="number" id="bet-amount" class="form-control bet-amount-input"
                   placeholder="Nhập số xu..." min="10" step="10">
          </div>

          <!-- Quick bet -->
          <div class="quick-bet-btns mb-3">
            <button class="quick-bet-btn" onclick="setQuickBet(50)">50</button>
            <button class="quick-bet-btn" onclick="setQuickBet(100)">100</button>
            <button class="quick-bet-btn" onclick="setQuickBet(200)">200</button>
            <button class="quick-bet-btn" onclick="setQuickBet(500)">500</button>
            <button class="quick-bet-btn" onclick="setMaxBet()">MAX</button>
          </div>

          <div class="potential-win mb-3">
            Thắng tiềm năng: <strong id="potential-win">—</strong>
          </div>

          <button class="btn btn-wcpl-primary w-100" id="place-bet-btn" onclick="placeBet()">
            Xác nhận đặt cược
          </button>
        </div>

        <!-- Thông báo locked -->
        <div id="locked-notice" class="alert alert-warning d-none">
          <i class="bi bi-lock me-1"></i>Kèo đã đóng — không thể đặt cược cho trận này.
        </div>

        <!-- Dự đoán của tôi trong trận này -->
        <div class="wcpl-card">
          <div class="wcpl-card-header">📋 Dự đoán của bạn trong trận này</div>
          <div id="my-predictions" class="p-3">
            <div class="text-muted small text-center py-2">Chưa có dự đoán.</div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div class="modal fade" id="repeat-bet-confirm-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="background:var(--wcpl-card-bg); border:1px solid var(--wcpl-border)">
        <div class="modal-header border-0">
          <h6 class="modal-title">
            <i class="bi bi-exclamation-triangle text-warning me-2"></i>Đặt thêm kèo này?
          </h6>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="small text-muted" id="repeat-bet-confirm-message"></div>
        </div>
        <div class="modal-footer border-0">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
          <button type="button" class="btn btn-wcpl-primary" id="repeat-bet-confirm-btn">
            Tiếp tục đặt
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/services/storage.js"></script>
  <script src="/config.js"></script>
  <script src="/js/services/api.js"></script>
  <script src="/js/services/auth.js"></script>
  <script src="/js/utils/auth-guard.js"></script>
  <script src="/js/utils/date.js"></script>
  <script src="/js/utils/format.js"></script>
  <script src="/js/components/toast.js"></script>
  <script src="/js/components/navbar.js"></script>
  <script src="/js/pages/match.js"></script>
</body>
</html>
