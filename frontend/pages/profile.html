<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hồ sơ — WCPL</title>
  <link rel="icon" href="/assets/favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/main.css" rel="stylesheet">
  <link href="/css/sportsbook.css" rel="stylesheet">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <div class="container-xl py-4">
    <div class="row g-4">

      <!-- ── Cột trái: Thông tin & cài đặt ─────────────────────── -->
      <div class="col-lg-4">

        <!-- Avatar + Credit -->
        <div class="wcpl-card p-4 text-center mb-4">
          <div class="position-relative d-inline-block mb-3">
            <img id="avatar-img" src="/assets/avatars/default_1.png" width="100" height="100"
                 class="rounded-circle border border-2 border-success" alt="Avatar">
            <button class="btn btn-sm btn-dark position-absolute bottom-0 end-0 rounded-circle p-1"
                    onclick="document.getElementById('avatar-upload').click()" title="Đổi avatar">
              📷
            </button>
          </div>
          <input type="file" id="avatar-upload" accept="image/*" class="d-none">

          <h5 class="fw-bold mb-0" id="display-name-text">—</h5>
          <div class="text-muted small mb-3" id="username-text">@—</div>
          <div class="credit-balance" id="credit-display">—</div>
          <div class="small text-muted">xu hiện tại</div>

          <div class="d-flex gap-2 mt-3 justify-content-center">
            <button class="btn btn-sm btn-outline-secondary" onclick="showDefaultAvatars()">
              Chọn avatar mặc định
            </button>
          </div>
        </div>

        <!-- Cập nhật hồ sơ -->
        <div class="wcpl-card p-3 mb-4">
          <div class="wcpl-card-header mb-3"><i class="bi bi-pencil-square me-2"></i>Cập nhật hồ sơ</div>
          <div class="mb-3">
            <label class="form-label">Tên hiển thị</label>
            <input type="text" id="display-name-input" class="form-control" maxlength="50">
          </div>
          <button class="btn btn-wcpl-primary w-100" onclick="updateProfile()">Lưu thay đổi</button>
        </div>

        <!-- Đổi mật khẩu -->
        <div class="wcpl-card p-3">
          <div class="wcpl-card-header mb-3"><i class="bi bi-shield-lock me-2"></i>Đổi mật khẩu</div>
          <div class="mb-3">
            <label class="form-label">Mật khẩu hiện tại</label>
            <input type="password" id="current-pw" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Mật khẩu mới</label>
            <input type="password" id="new-pw" class="form-control">
          </div>
          <button class="btn btn-outline-warning w-100" onclick="changePassword()">Đổi mật khẩu</button>
        </div>
      </div>

      <!-- ── Cột phải: Thống kê + Lịch sử ─────────────────────── -->
      <div class="col-lg-8">

        <!-- Thống kê -->
        <div class="row g-3 mb-4" id="stats-row">
          <div class="col-6 col-md-3">
            <div class="wcpl-card p-3 text-center">
              <div class="fs-4 fw-bold text-warning" id="stat-total">—</div>
              <div class="small text-muted">Tổng kèo</div>
            </div>
          </div>
          <div class="col-6 col-md-3">
            <div class="wcpl-card p-3 text-center">
              <div class="fs-4 fw-bold text-success" id="stat-wins">—</div>
              <div class="small text-muted">Thắng</div>
            </div>
          </div>
          <div class="col-6 col-md-3">
            <div class="wcpl-card p-3 text-center">
              <div class="fs-4 fw-bold" id="stat-rate">—</div>
              <div class="small text-muted">Tỷ lệ thắng</div>
            </div>
          </div>
          <div class="col-6 col-md-3">
            <div class="wcpl-card p-3 text-center">
              <div class="fs-4 fw-bold text-info" id="stat-profit">—</div>
              <div class="small text-muted">Lợi nhuận</div>
            </div>
          </div>
        </div>

        <!-- Tabs: Dự đoán | Credit history -->
        <div class="wcpl-card">
          <ul class="nav nav-tabs border-0 px-3 pt-2">
            <li class="nav-item">
              <button class="nav-link active" id="tab-predictions" onclick="switchTab('predictions')">
                📋 Lịch sử dự đoán
              </button>
            </li>
            <li class="nav-item">
              <button class="nav-link" id="tab-credits" onclick="switchTab('credits')">
                <i class="bi bi-coin me-1"></i>Lịch sử credit
              </button>
            </li>
          </ul>

          <div id="tab-content" class="p-3">
            <div class="text-center py-4 text-muted">
              <div class="spinner-border spinner-border-sm me-2"></div>Đang tải...
            </div>
          </div>

          <div class="p-3 border-top d-flex justify-content-center gap-2"
               style="border-color:var(--wcpl-border)!important" id="pagination-row"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal chọn avatar mặc định -->
  <div class="modal fade" id="avatar-modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="background:var(--wcpl-card-bg); border:1px solid var(--wcpl-border)">
        <div class="modal-header border-0">
          <h6 class="modal-title">Chọn avatar mặc định</h6>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" style="max-height:420px; overflow-y:auto">
          <p class="text-muted small mb-3"><i class="bi bi-person-badge me-1"></i>Cầu thủ nổi tiếng &amp; avatar mặc định</p>
          <div class="row g-3" id="default-avatars"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/services/storage.js"></script>
  <script src="/js/services/api.js"></script>
  <script src="/js/services/auth.js"></script>
  <script src="/js/utils/auth-guard.js"></script>
  <script src="/js/utils/date.js"></script>
  <script src="/js/utils/format.js"></script>
  <script src="/js/components/toast.js"></script>
  <script src="/js/components/navbar.js"></script>
  <script src="/js/pages/profile.js"></script>
</body>
</html>
