<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý User — Admin</title>
  <link rel="icon" href="/assets/favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/main.css" rel="stylesheet">
</head>
<body>
  <div id="navbar-placeholder"></div>
  <div class="container-xl py-4">
    <div class="d-flex align-items-center mb-4 gap-3 flex-wrap">
      <h5 class="fw-bold mb-0">👥 Quản lý User</h5>
      <button class="btn btn-success btn-sm ms-auto" onclick="showCreateModal()">
        + Tạo tài khoản mới
      </button>
    </div>

    <div class="wcpl-card">
      <div id="user-table">
        <div class="text-center py-5 text-muted">
          <div class="spinner-border spinner-border-sm me-2"></div>Đang tải...
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Tạo user -->
  <div class="modal fade" id="create-modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="background:var(--wcpl-card-bg); border:1px solid var(--wcpl-border)">
        <div class="modal-header border-0">
          <h6 class="modal-title">Tạo tài khoản mới</h6>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" id="new-username" class="form-control" placeholder="username">
          </div>
          <div class="mb-3">
            <label class="form-label">Tên hiển thị</label>
            <input type="text" id="new-displayname" class="form-control" placeholder="Họ tên">
          </div>
          <div class="mb-3">
            <label class="form-label">Mật khẩu</label>
            <input type="password" id="new-password" class="form-control">
          </div>
        </div>
        <div class="modal-footer border-0">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
          <button class="btn btn-success" onclick="createUser()">Tạo tài khoản</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Reset mật khẩu -->
  <div class="modal fade" id="reset-pw-modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content" style="background:var(--wcpl-card-bg); border:1px solid var(--wcpl-border)">
        <div class="modal-header border-0">
          <h6 class="modal-title">Reset mật khẩu</h6>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="reset-user-id">
          <div class="mb-3">
            <label class="form-label">Mật khẩu mới</label>
            <input type="password" id="reset-pw-value" class="form-control">
          </div>
        </div>
        <div class="modal-footer border-0">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
          <button class="btn btn-warning" onclick="resetPassword()">Reset</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Cập nhật credit -->
  <div class="modal fade" id="credit-modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content" style="background:var(--wcpl-card-bg); border:1px solid var(--wcpl-border)">
        <div class="modal-header border-0">
          <h6 class="modal-title">Cập nhật Credit</h6>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="credit-user-id">
          <div class="mb-3">
            <label class="form-label">Số xu (+/-)</label>
            <input type="number" id="credit-amount" class="form-control" placeholder="Ví dụ: 500 hoặc -200">
          </div>
          <div class="mb-3">
            <label class="form-label">Lý do</label>
            <input type="text" id="credit-reason" class="form-control" placeholder="Ghi chú">
          </div>
        </div>
        <div class="modal-footer border-0">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
          <button class="btn btn-primary" onclick="updateCredit()">Cập nhật</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/services/storage.js"></script>
  <script src="/config.js"></script>
  <script src="/js/services/api.js"></script>
  <script src="/js/services/auth.js"></script>
  <script src="/js/utils/auth-guard.js"></script>
  <script src="/js/utils/format.js"></script>
  <script src="/js/components/toast.js"></script>
  <script src="/js/components/navbar.js"></script>
  <script src="/js/pages/admin/users.js"></script>
</body>
</html>
