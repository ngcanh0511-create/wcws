<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard — WCPL</title>
  <link rel="icon" href="/assets/favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/main.css" rel="stylesheet">
</head>
<body>
  <div id="navbar-placeholder"></div>
  <div class="container-xl py-4">
    <div class="d-flex align-items-center gap-3 mb-4">
      <h5 class="fw-bold mb-0"><i class="bi bi-sliders me-2"></i>Admin Dashboard</h5>
      <div class="ms-auto d-flex gap-2">
        <a href="/pages/admin/users.html" class="btn btn-sm btn-outline-primary">👥 Users</a>
        <a href="/pages/admin/matches.html" class="btn btn-sm btn-outline-success"><i class="bi bi-calendar2-week me-1"></i>Matches</a>
        <a href="/pages/admin/config.html" class="btn btn-sm btn-outline-warning"><i class="bi bi-gear me-1"></i>Config</a>
      </div>
    </div>

    <!-- Stats -->
    <div class="row g-3 mb-4" id="stats-cards">
      <div class="col-6 col-md-3">
        <div class="wcpl-card p-3 text-center">
          <div class="fs-2 fw-bold text-primary" id="stat-users">—</div>
          <div class="small text-muted">Người dùng</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="wcpl-card p-3 text-center">
          <div class="fs-2 fw-bold text-success" id="stat-matches">—</div>
          <div class="small text-muted">Tổng trận</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="wcpl-card p-3 text-center">
          <div class="fs-2 fw-bold text-warning" id="stat-upcoming">—</div>
          <div class="small text-muted">Sắp diễn ra</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="wcpl-card p-3 text-center">
          <div class="fs-2 fw-bold text-secondary" id="stat-finished">—</div>
          <div class="small text-muted">Đã kết thúc</div>
        </div>
      </div>
    </div>

    <!-- Quick actions -->
    <div class="wcpl-card p-4">
      <div class="wcpl-card-header mb-3">⚡ Thao tác nhanh</div>
      <div class="row g-3">
        <div class="col-md-4">
          <a href="/pages/admin/users.html" class="btn btn-outline-primary w-100">
            <i class="bi bi-people me-1"></i>Quản lý User<br><small class="text-muted">Tạo, khóa, reset mật khẩu</small>
          </a>
        </div>
        <div class="col-md-4">
          <a href="/pages/admin/matches.html" class="btn btn-outline-success w-100">
            <i class="bi bi-calendar2-week me-1"></i>Quản lý Trận đấu<br><small class="text-muted">Nhập kèo, nhập kết quả</small>
          </a>
        </div>
        <div class="col-md-4">
          <a href="/pages/admin/config.html" class="btn btn-outline-warning w-100">
            <i class="bi bi-gear me-1"></i>Cấu hình hệ thống<br><small class="text-muted">Credit, lock time, giới hạn cược</small>
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/services/storage.js"></script>
  <script src="/config.js"></script>
  <script src="/js/services/api.js"></script>
  <script src="/js/services/auth.js"></script>
  <script src="/js/utils/auth-guard.js"></script>
  <script src="/js/utils/format.js"></script>
  <script src="/js/components/toast.js"></script>
  <script src="/js/components/navbar.js"></script>
  <script src="/js/pages/admin/dashboard.js"></script>
</body>
</html>
