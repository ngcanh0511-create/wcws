<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập — WCPL</title>
  <link rel="icon" href="/assets/favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/main.css" rel="stylesheet">
</head>
<body class="login-page">

  <div class="login-card shadow-lg">
    <div class="text-center mb-4">
      <div class="login-logo"><i class="bi bi-trophy-fill"></i></div>
      <div class="login-title">World Cup Prediction</div>
      <p class="text-muted small mt-1">League nội bộ — Chỉ dành cho nhóm bạn</p>
    </div>

    <form id="login-form" novalidate>
      <div class="mb-3">
        <label class="form-label" for="username">Tên đăng nhập</label>
        <input type="text" id="username" class="form-control" placeholder="Nhập username"
               autocomplete="username" autofocus required>
      </div>

      <div class="mb-4">
        <label class="form-label" for="password">Mật khẩu</label>
        <div class="input-group">
          <input type="password" id="password" class="form-control" placeholder="••••••••"
                 autocomplete="current-password" required>
          <button type="button" class="btn btn-outline-secondary" id="toggle-pw" tabindex="-1">
            👁
          </button>
        </div>
      </div>

      <div id="error-msg" class="alert alert-danger d-none py-2 small" role="alert"></div>

      <button type="submit" class="btn btn-wcpl-primary w-100" id="login-btn">
        Đăng nhập
      </button>
    </form>

    <p class="text-center text-muted small mt-4 mb-0">
      Chưa có tài khoản? Liên hệ Admin.
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/services/storage.js"></script>
  <script src="/js/services/api.js"></script>
  <script src="/js/services/auth.js"></script>
  <script src="/js/pages/login.js"></script>
</body>
</html>
