spring:
  application:
    name: wcpl-backend

  datasource:
    url: jdbc:sqlite:${user.home}/wcpl/wcpl.db
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:wcpl-dev-secret-key-change-in-production-min-256-bits}
    access-token-expiry-ms: 900000       # 15 phút
    refresh-token-expiry-ms: 604800000   # 7 ngày

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500}

  upload:
    avatar-dir: ${user.home}/wcpl/avatars

  football-api:
    provider: ${FOOTBALL_API_PROVIDER:worldcup26}
    base-url: ${FOOTBALL_API_BASE_URL:https://v3.football.api-sports.io}
    api-key: ${FOOTBALL_API_KEY:your-api-key-here}
    league-id: ${FOOTBALL_API_LEAGUE_ID:1}
    season: ${FOOTBALL_API_SEASON:2026}
    worldcup26:
      base-url: ${WORLDCUP26_API_BASE_URL:https://worldcup26.ir/get}

logging:
  level:
    com.wcpl: DEBUG
    org.springframework.security: WARN
